<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Session Archive Manager: archive and restore your Claude Code sessions with one toggle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#2b1e17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>
  <g transform="translate(86,84)">
    <rect x="28" y="0" width="140" height="100" rx="16" fill="#3b2b23"/>
    <rect x="14" y="22" width="168" height="110" rx="16" fill="#523a2d"/>
    <rect x="0" y="48" width="196" height="136" rx="18" fill="#F4EDE4"/>
    <rect x="22" y="74" width="104" height="13" rx="6.5" fill="#2b1e17"/>
    <rect x="22" y="98" width="64" height="10" rx="5" fill="#2ea44f"/>
    <rect x="22" y="136" width="78" height="32" rx="16" fill="#D97757"/>
    <circle cx="84" cy="152" r="11" fill="#ffffff"/>
    <rect x="116" y="136" width="58" height="32" rx="16" fill="#d9cfc4"/>
    <circle cx="132" cy="152" r="11" fill="#ffffff"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="330" y="112" font-size="19" font-weight="700" letter-spacing="3" fill="#D97757">CLAUDE CODE MOD</text>
    <text x="330" y="178" font-size="58" font-weight="800" fill="#FFF7F0">Session Archive Manager</text>
    <text x="330" y="226" font-size="27" fill="#E8D9CC">Archive and restore your sessions with one toggle.</text>
    <g font-size="19" fill="#F4EDE4" text-anchor="middle">
      <rect x="330" y="258" width="132" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="396" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/sessions</text>
      <rect x="474" y="258" width="168" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="558" y="284">Never deletes</text>
      <rect x="654" y="258" width="222" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="765" y="284">Keeps your sections</text>
      <rect x="888" y="258" width="212" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="994" y="284">Free and open source</text>
    </g>
